<!-- الصفحة الرئيسية - Bootstrap 5 Edition -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشروع bootstrap النهائي المتكامل</title>
 
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
</head>
<body class="bg-secondary-subtle py-5">

  <div class="container" style="max-width: 1000px;">

    <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">

      <header class="text-center pb-3 mb-4 border-bottom">
        <h1 class="fw-bold text-dark mb-3 fs-2">منصة البرمجة الاحترافية</h1>
        <nav>
          <div class="d-flex flex-wrap justify-content-center gap-2">
            <a href="../courses/courses.html" class="btn btn-success rounded-3 shadow-sm px-3 py-1 fs-6">الدورات</a>
            <a href="../dashboard/dashboard.html" class="btn btn-success rounded-3 shadow-sm px-3 py-1 fs-6">لوحة التحكم</a>
            <a href="../profile/profile.html" class="btn btn-success rounded-3 shadow-sm px-3 py-1 fs-6">الملف الشخصي</a>
            <a href="../settings/settings.html" class="btn btn-success rounded-3 shadow-sm px-3 py-1 fs-6">الإعدادات</a>
            <a href="../subscribe/subscribe.html" class="btn btn-success rounded-3 shadow-sm px-3 py-1 fs-6">الاشتراك</a>
            <a href="../search/search.html" class="btn btn-success rounded-3 shadow-sm px-3 py-1 fs-6">بحث</a>
            <a href="../contact/contact.html" class="btn btn-success rounded-3 shadow-sm px-3 py-1 fs-6">تواصل معنا</a>
          </div>
        </nav>
      </header>

      <main class="d-flex flex-column gap-4">

      
        <section class="border-bottom pb-4">
          <h2 class="h5 fw-bold text-dark mb-3">
            <i class="bi bi-info-circle text-primary me-2"></i>مقدمة عن المنصة
          </h2>
          <p class="text-muted lh-base mb-0">
          
          </p>
        </section>

       
        <section class="border-bottom pb-4">
          <h2 class="h5 fw-bold text-dark mb-3">
            <i class="bi bi-journal-text text-success me-2"></i>مقالات مميزة
          </h2>
          <div class="row g-3">
            <div class="col-md-6">
              <article class="p-3 bg-light border-start border-4 border-success rounded-3 shadow-sm h-100">
                <h3 class="h6 fw-bold text-dark mb-2">لماذا HTML هي الأساس؟</h3>
                <p class="text-muted fs-6 mb-0">
            
                </p>
              </article>
            </div>
            <div class="col-md-6">
              <article class="p-3 bg-light border-start border-4 border-success rounded-3 shadow-sm h-100">
                <h3 class="h6 fw-bold text-dark mb-2">نصائح لتعلم HTML بسرعة</h3>
                <p class="text-muted fs-6 mb-0">
                
                </p>
              </article>
            </div>
          </div>
        </section>

        <section class="border-bottom pb-4">
          <h2 class="h5 fw-bold text-dark mb-3">
            <i class="bi bi-play-btn text-danger me-2"></i>معلومات إضافية
          </h2>
          <div class="row g-4 justify-content-center">
     
            <div class="col-12 text-center">
              <img src="https://www.ultimatewb.com/blog/wp-content/uploads/html-js-css-website-coding-1200x666.webp" 
                   alt="صورة معلوماتية" 
                   class="img-fluid rounded-3 shadow-sm border" 
                   style="max-width: 85%; max-height: 450px; object-fit: cover;">
                   <div class="col-12 text-center mt-2">
  <p class="text-muted fw-medium fs-6 mb-0">
    <i class="bi bi-exclamation-circle me-1 text-warning"></i> لغات الويب
  </p>
</div>
            </div>

            <div class="col-12 col-md-10">
              <div class="ratio ratio-16x9 rounded-3 overflow-hidden shadow-sm border">
                <iframe src="https://www.youtube.com/embed/HGTJBPNC-Gw" 
                        title="فيديو تعليمي" 
                        allowfullscreen></iframe>
              </div>
              <div class="col-12 text-center mt-2">
  <p class="text-muted fw-medium fs-6 mb-0">
    <i class="bi bi-exclamation-circle me-1 text-warning"></i> دورة لم تشاهدها بعد
  </p>
</div>
            </div>
          </div>
        </section>

    
        <section class="pb-2">
          <h2 class="h5 fw-bold text-dark mb-3">
            <i class="bi bi-envelope-paper text-warning me-2"></i>نموذج تواصل سريع
          </h2>
          <form class="bg-light p-4 border rounded-3 shadow-sm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="fast-name" class="form-label fw-semibold text-dark">الاسم:</label>
                <input type="text" id="fast-name" class="form-check-input-bg form-control" required placeholder="أدخل اسمك الكريم">
              </div>

              <div class="col-md-6">
                <label for="fast-email" class="form-label fw-semibold text-dark">البريد الإلكتروني:</label>
                <input type="email" id="fast-email" class="form-control" required placeholder="name@example.com">
              </div>

              <div class="col-12">
                <label for="fast-msg" class="form-label fw-semibold text-dark">رسالتك:</label>
                <textarea id="fast-msg" class="form-control" rows="3" required placeholder="اكتب استفسارك هنا..."></textarea>
              </div>

              <div class="col-12 text-start mt-3">
                <button type="submit" class="btn btn-success fw-bold px-4 py-2 rounded-3 shadow-sm">
                  إرسال الرسالة
                </button>
              </div>
            </div>
          </form>
        </section>

      </main>

    
      <footer class="text-center text-muted border-top pt-3 mt-4 small">
        <p class="mb-0">© 2026 جميع الحقوق محفوظة - أكاديمية البرمجة</p>
      </footer>

    </div>

  </div>

</body>
</html>

<!-- الملف الشخصي - Bootstrap 5 Edition -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي</title>



  <!-- Bootstrap 5 RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-secondary-subtle py-5">

  <div class="container" style="max-width: 750px;">

    <!-- الهيدر والعنوان -->
    <header class="text-center pb-3 mb-4 border-bottom bg-white p-4 rounded-4 shadow-sm">
      <h1 class="fw-bold text-dark mb-3 fs-3">الملف الشخصي</h1>
      <nav>
        <a href="../index/index.html" class="btn btn-success rounded-3 shadow-sm px-4 py-2 fs-6 fw-bold">
          <i class="bi bi-house-door-fill me-1"></i> الصفحة الرئيسية
        </a>
      </nav>
    </header>

    <main class="d-flex flex-column gap-4">

      <!-- كارت بيانات المستخدم -->
      <section class="card shadow-sm border-0 rounded-4 p-4 bg-white">
        <h2 class="h5 fw-bold text-dark pb-2 mb-3 border-bottom">
          <i class="bi bi-person-badge text-primary me-2"></i>بيانات المستخدم
        </h2>
        
        <div class="text-center mb-4">
          <img src="https://static.vecteezy.com/system/resources/previews/046/409/821/non_2x/avatar-profile-icon-in-flat-style-male-user-profile-illustration-on-isolated-background-man-profile-sign-business-concept-vector.jpg" 
               alt="صورة المستخدم" 
               class="img-fluid rounded-circle shadow-sm border p-1" 
               style="max-width: 150px; height: 150px; object-fit: cover;">
        </div>

        <div class="bg-light p-3 rounded-3 border">
          <div class="row g-2">
            <div class="col-sm-6">
              <p class="mb-2 text-muted"><strong class="text-dark">الاسم:</strong> هشام الدخيل</p>
            </div>
            <div class="col-sm-6">
              <p class="mb-2 text-muted"><strong class="text-dark">الجنس:</strong> ذكر</p>
            </div>
            <div class="col-sm-6">
              <p class="mb-2 text-muted"><strong class="text-dark">البريد الإلكتروني:</strong> Hisham@gmail.com</p>
            </div>
            <div class="col-sm-6">
              <p class="mb-0 text-muted"><strong class="text-dark">البلد:</strong> السعودية</p>
            </div>
          </div>
        </div>
      </section>

      <!-- كارت تحديث البيانات -->
      <section class="card shadow-sm border-0 rounded-4 p-4 bg-white">
        <h2 class="h5 fw-bold text-dark pb-2 mb-3 border-bottom">
          <i class="bi bi-pencil-square text-success me-2"></i>تحديث بياناتك
        </h2>

        <form>
          <div class="mb-3">
            <label for="user-name" class="form-label fw-semibold text-dark">الاسم:</label>
            <input type="text" id="user-name" class="form-control" placeholder="أدخل اسمك الجديد">
          </div>

          <div class="mb-3">
            <label for="user-email" class="form-label fw-semibold text-dark">البريد الإلكتروني:</label>
            <input type="email" id="user-email" class="form-control" placeholder="name@example.com">
          </div>

          <div class="mb-3">
            <label for="user-password" class="form-label fw-semibold text-dark">كلمة المرور الجديدة:</label>
            <input type="password" id="user-password" class="form-control" placeholder="••••••••">
          </div>

          <!-- خيارات الجنس -->
          <div class="mb-4">
            <label class="form-label fw-semibold text-dark d-block">الجنس:</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="male" value="ذكر" checked>
              <label class="form-check-label text-dark" for="male">ذكر</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="female" value="أنثى">
              <label class="form-check-label text-dark" for="female">أنثى</label>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-3 shadow-sm">
            <i class="bi bi-check-circle me-1"></i> حفظ التغييرات
          </button>
        </form>
      </section>

    </main>

    <!-- الفوتر -->
    <footer class="text-center text-muted border-top pt-3 mt-4 small">
      <p class="mb-0">© 2026 أكاديمية البرمجة</p>
    </footer>

  </div>

</body>
</html>

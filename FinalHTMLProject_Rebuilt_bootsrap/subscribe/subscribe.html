<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اشترك الآن</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-secondary-subtle py-5">

  <div class="container" style="max-width: 700px;">

    <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">

      <header class="text-center pb-3 mb-4 border-bottom">
        <h1 class="fw-bold text-dark mb-3 fs-3">اشترك في المنصة</h1>
        <nav>
          <a href="../index/index.html" class="btn btn-success rounded-3 shadow-sm px-4 py-2 fs-6 fw-bold">
            <i class="bi bi-house-door-fill me-1"></i> الصفحة الرئيسية
          </a>
        </nav>
      </header>

      <main>
        <form>

          <h2 class="h6 fw-bold text-secondary mb-3">البيانات الشخصية</h2>

          <div class="mb-3">
            <label for="name" class="form-label fw-semibold text-dark">الاسم الكامل</label>
            <input type="text" class="form-control form-control-lg fs-6" id="name" placeholder="مثال: هشام الدخيل">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold text-dark">البريد الإلكتروني</label>
            <input type="email" class="form-control form-control-lg fs-6" id="email" placeholder="name@example.com">
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="password" class="form-label fw-semibold text-dark">كلمة المرور</label>
              <input type="password" class="form-control form-control-lg fs-6" id="password">
            </div>
            <div class="col-md-6">
              <label for="confirm-password" class="form-label fw-semibold text-dark">تأكيد كلمة المرور</label>
              <input type="password" class="form-control form-control-lg fs-6" id="confirm-password">
            </div>
          </div>

          <hr class="my-4 text-muted">

          <h2 class="h6 fw-bold text-secondary mb-3">تفاصيل الدفع</h2>

          <div class="mb-4">
            <label class="form-label fw-semibold text-dark d-block mb-2">اختر طريقة الدفع:</label>
         <div class="d-flex flex-column gap-3">
       <!-- مدى -->
    <div class="form-check d-flex align-items-center gap-2 p-0 m-0">
      <input class="form-check-input m-0" type="radio" name="payment_method" id="pay-mada" value="mada" checked>
      <label class="form-check-label d-flex align-items-center" for="pay-mada" style="cursor: pointer;">
        <img src="https://m.eyeofriyadh.com/news_images/2018/11/23f9b80307b69.jpg" alt="مدى" height="30" class="rounded">
        <span>مدى</span>
      </label>
    </div>

    <!-- فيزا / ماستركارد -->
    <div class="form-check d-flex align-items-center gap-2 p-0 m-0">
      <input class="form-check-input m-0" type="radio" name="payment_method" id="pay-card" value="credit_card">
      <label class="form-check-label d-flex align-items-center" for="pay-card" style="cursor: pointer;">
        <img src="https://thumbs.dreamstime.com/b/kiev-ukraine-september-visa-mastercard-logos-printed-white-paper-visa-mastercard-american-multinational-102631953.jpg?w=768" alt="فيزا / ماستركارد" height="30" class="rounded">
        <span>فيزا / ماستركارد</span>
      </label>
    </div>

              <!-- Apple Pay -->
    <div class="form-check d-flex align-items-center gap-2 p-0 m-0">
      <input class="form-check-input m-0" type="radio" name="payment_method" id="pay-apple" value="apple_pay">
      <label class="form-check-label d-flex align-items-center" for="pay-apple" style="cursor: pointer;">
        <img src="https://logo-teka.com/wp-content/uploads/2025/12/apple-pay-bage-logo.svg" alt="Apple Pay" height="36" class="rounded"> 
        <span class="ms-2">ابل باي</span>
      </label>
    </div>

    <!-- Google Pay -->
    <div class="form-check d-flex align-items-center gap-2 p-0 m-0">
      <input class="form-check-input m-0" type="radio" name="payment_method" id="pay-google" value="google_pay">
      <label class="form-check-label d-flex align-items-center" for="pay-google" style="cursor: pointer;">
        <img src="https://logo-teka.com/wp-content/uploads/2025/12/google-pay-logo.svg" alt="Google Pay" height="36" class="rounded">
        <span class="ms-2">قوقل باي</span>
      </label>
    </div>
    </div>
    <br>
   
          <div class="mb-3">
            <label for="card-name" class="form-label fw-semibold text-dark">الاسم على البطاقة</label>
            <input type="text" class="form-control form-control-lg fs-6" id="card-name" placeholder="مثال: هشام الدخيل">
          </div>

          <div class="mb-3">
            <label for="card-number" class="form-label fw-semibold text-dark">رقم البطاقة</label>
            <div class="input-group dir-ltr">
              <input type="text" class="form-control form-control-lg fs-6 text-end" id="card-number" placeholder="0000 0000 0000 0000">
              <span class="input-group-text bg-light"><i class="bi bi-credit-card-fill text-secondary"></i></span>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6">
              <label for="expiry-date" class="form-label fw-semibold text-dark">تاريخ الانتهاء</label>
              <input type="text" class="form-control form-control-lg fs-6 text-center" id="expiry-date" placeholder="MM/YY">
            </div>
            <div class="col-6">
              <label for="cvv" class="form-label fw-semibold text-dark">رمز الأمان (CVV)</label>
              <input type="text" class="form-control form-control-lg fs-6 text-center" id="cvv" placeholder="123">
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-3 fs-5 fw-bold rounded-3 shadow-sm mt-3">
            <i class="bi bi-check-circle-fill me-1"></i> اشترك الآن
          </button>

        </form>
      </main>

      <footer class="text-center text-muted border-top pt-3 mt-4 small">
        <p class="mb-0">© 2026 الاشتراك في المنصة - جميع الحقوق محفوظة</p>
      </footer>

    </div>

  </div>

</body>
</html>

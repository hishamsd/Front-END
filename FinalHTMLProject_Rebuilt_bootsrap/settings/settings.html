<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-secondary-subtle py-5">

  <div class="container" style="max-width: 650px;">

    <header class="text-center pb-3 mb-4 border-bottom bg-white p-4 rounded-4 shadow-sm">
      <h1 class="fw-bold text-dark mb-3 fs-3">إعدادات الحساب</h1>
      <nav>
        <a href="../index/index.html" class="btn btn-success rounded-3 shadow-sm px-4 py-2 fs-6 fw-bold">
          <i class="bi bi-house-door-fill me-1"></i> الصفحة الرئيسية
        </a>
      </nav>
    </header>

    <main>
      <section class="card shadow-sm border-0 rounded-4 p-4 bg-white">
        <h2 class="h5 fw-bold text-dark pb-2 mb-4 border-bottom">
          <i class="bi bi-gear-fill text-primary me-2"></i>تفضيلات المستخدم
        </h2>

        <form>
          <div class="mb-4">
            <label for="preferred-language" class="form-label fw-semibold text-dark">اللغة المفضلة:</label>
            <select id="preferred-language" class="form-select form-select-lg fs-6">
              <option selected>العربية</option>
              <option>English</option>
            </select>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold text-dark d-block mb-2">تفعيل الإشعارات:</label>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="email-notif" checked>
              <label class="form-check-label text-dark" for="email-notif">
                بريد إلكتروني
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="sms-notif">
              <label class="form-check-label text-dark" for="sms-notif">
                رسائل نصية
              </label>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold text-dark d-block mb-2">اختيار المظهر:</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="theme" id="theme-light" value="light" checked>
              <label class="form-check-label text-dark" for="theme-light">فاتح</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="theme" id="theme-dark" value="dark">
              <label class="form-check-label text-dark" for="theme-dark">داكن</label>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-3 shadow-sm mt-2">
            <i class="bi bi-check-lg me-1"></i> حفظ الإعدادات
          </button>
        </form>
      </section>
    </main>

    <footer class="text-center text-muted border-top pt-3 mt-4 small">
      <p class="mb-0">© 2026 إعدادات الحساب - جميع الحقوق محفوظة</p>
    </footer>

  </div>

</body>
</html>

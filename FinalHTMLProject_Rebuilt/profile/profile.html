<!-- الملف الشخصي -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>الملف الشخصي</title>
</head>
<body>
    <header class="header-box">
        <h1 class="main-title">الملف الشخصي</h1>
        <nav><a href="../index/index.html">الصفحة الرئيسية</a></nav>
    </header>

    <main class="main1">
        <section class="card1">
            <h2>بيانات المستخدم</h2>
            <img src="https://static.vecteezy.com/system/resources/previews/046/409/821/non_2x/avatar-profile-icon-in-flat-style-male-user-profile-illustration-on-isolated-background-man-profile-sign-business-concept-vector.jpg" alt="صورة المستخدم">
            <p>الاسم: هشام الدخيل</p>
            <P>الجنس: ذكر</P>
            <p>البريد الإلكتروني: Hisham@gmail.com</p>
            <p>البلد: السعودية</p>
        </section>

        <section class="card1" style="margin-top: 20px;">
            <h2>تحديث بياناتك</h2>
            <form>
                <label>الاسم:</label><br>
                <input type="text"><br><br>
                <label>البريد الإلكتروني:</label><br>
                <input type="email"><br><br>
                <label>كلمة المرور الجديدة:</label><br>
                <input type="password"><br><br>
                <label>الجنس:</label><br>
                <input type="radio" id="male" name="gender" value="ذكر" checked>
                <label for="male" style="font-weight: normal;">ذكر</label>
                
                <input type="radio" id="female" name="gender" value="أنثى" style="margin-right: 15px;">
                <label for="female" style="font-weight: normal;">أنثى</label><br><br>
                <button type="submit">حفظ التغييرات</button>
                
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 أكاديمية البرمجة</p>
    </footer>
</body>
</html>

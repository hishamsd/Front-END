<!-- نماذج متقدمة - الحقول التفاعلية -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="task1.css">
    <title>حقول الإدخال المتقدمة</title>
</head>
<body>
    <h1>تسجيل</h1>
    <form>
        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" required><br>

     <label>رقم الهاتف:</label>
        <input type="tel" pattern="[0-9]{10}" title="أدخل 10 أرقام"><br>

        <label for="date">التاريخ:</label>
        <input type="date" id="date"><br>

        <label for="color">اختيار لون:</label>
        <input type="color" id="color"><br>

        <label for="file">تحميل ملف:</label>
        <input type="file" id="file"><br><br>

           

        <button type="submit">تسجيل الحساب</button>
    </form>
</body>
</html>

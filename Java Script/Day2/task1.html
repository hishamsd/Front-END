<!DOCTYPE html>
<html lang="ar">
    <!-- الوسوم الوصفية -->
<head>
    <meta charset="utf-8">
    <style>

          
   
    
   .dark-mode {
    background-color: black;
    color: white;
}
    button {
      padding: 10px 20px;
      cursor: pointer;
      margin-right: 10px;
    }


    </style>

    <title>btn </title>
</head>
<body>
    <h1 id="text">hisham</h1>
<button id="btn">change mode</button>

<script>

const btn = document.getElementById("btn");
const text = document.getElementById("text");

btn.addEventListener("click", () => {
    text.classList.toggle("dark-mode");
});


</script>



</body>
</html>

<!DOCTYPE html>
<html lang="ar">

    <meta charset="utf-8">
    <title>جدول الطلاب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

       
        #Student_Table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 20px;
            text-align: left;
        }

        #Student_Table th, 
        #Student_Table td {
            border: 1px solid #ddd;
            padding: 10px 15px;
        }

     
        #Student_Table th {
            background-color: #f4f4f4;
            color: #333;
        }

       
        #Student_Table tbody tr:hover {
            background-color: #f9f9f9;
        }
    </style>

</head>
<body>

<table id="Student_Table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Grade</th>
        </tr>
    </thead>
    <tbody>
       
    </tbody>
</table>

<script>
const students = [
  { name: "Ali", grade: 90 },
  { name: "Sara", grade: 85 },
  { name: "Omar", grade: 78 }
];


const tableBody = document.querySelector("#Student_Table tbody");

for (let i = 0; i < students.length; i++) {
    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${students[i].name}</td>
        <td>${students[i].grade}</td>
    `;

    tableBody.appendChild(row);
}
</script>

</body>
</html>

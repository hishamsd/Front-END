<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 3A - Score Evaluation</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        .output {
            margin-top: 15px;
            padding: 10px;
            background-color: #e7f3ff;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h2>Task 3A: Evaluate Score using if Statement</h2>

    <form onsubmit="checkScore(); return false;">
        <label>Student Name:</label><br>
        <input type="text" id="studentName"><br><br>

        <label>Mark:</label><br>
        <input type="number" id="markInput"><br><br>

        <label>Full Mark:</label><br>
        <input type="number" id="fullMarkInput"><br><br>

        <button type="submit">Check Result</button>
    </form>

    <div id="scoreResult" class="output"></div>

    <script>
        function checkScore() {
            var name = document.getElementById("studentName").value;
            var mark = parseInt(document.getElementById("markInput").value);
            var fullMark = parseInt(document.getElementById("fullMarkInput").value);
            
           
            var percentage = (mark / fullMark) * 100;
            var result = "";

            if (isNaN(mark) || isNaN(fullMark) || name == "") {
                result = "Please enter valid data.";
            } else if (percentage >= 90) {
                result = "Excellent";
            } else if (percentage >= 70) {
                result = "Good Job";
            } else {
                result = "Keep Trying";
            }

           
            document.getElementById("scoreResult").innerHTML = 
                "Student Name: " + name + "<br>" +
                "Mark: " + mark + "<br>" +
                "Full Mark: " + fullMark + "<br>" +
                "Percentage: " + percentage + "%<br>" +
                "Evaluation: " + result;
        }
    </script>
</body>
</html>
